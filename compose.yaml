name: dusheng-danmu

services:
  danmu-api:
    image: dushengtv/danmu-api:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:9321:9321"
    environment:
      DANMU_API_PORT: "9321"
    volumes:
      - ./config:/app/config
      - ./data:/app/.cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9321/healthz', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
