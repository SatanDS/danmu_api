# Host networking permits loopback-only authorization against the existing Bot.
# Official image envsubst replaces ONLY the two DUSHENG_ variables below.
# The certificate must cover danmu.dusheng.lol; set the CDN origin SNI accordingly.
server {
    listen 9443 ssl;
    listen [::]:9443 ssl;
    server_name danmu.dusheng.lol;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Bot checks its current trusted_proxy_cidrs for every request. Failure denies access.
    auth_request /_dusheng_cdn_auth;
    client_max_body_size 16k;
    client_body_timeout 15s;

    location = /_dusheng_cdn_auth {
        internal;
        auth_request off;
        proxy_pass http://127.0.0.1:${DUSHENG_BOT_API_PORT}/emby/cdn_origin;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-DuSheng-Line-Token "${DUSHENG_CDN_AUTH_TOKEN}";
        proxy_set_header X-Proxy-Peer-IP $realip_remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
        proxy_cache off;
    }

    location = /api/v1/dushengtv/danmaku {
        if ($request_method != POST) { return 405; }

        proxy_pass http://127.0.0.1:9321;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
        proxy_cache off;
    }

    location = /healthz {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        proxy_pass http://127.0.0.1:9321;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        proxy_cache off;
    }

    location / {
        return 404;
    }
}
